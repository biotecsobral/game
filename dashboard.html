<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAINEL DE CONTROLE - PATENT DNA</title>
    <style>
        /* Paleta de Cores baseada na Logo */
        :root {
            --bg-dark: #030613;
            --bg-panel: rgba(10, 17, 40, 0.8);
            --green-neon: #39ff14;
            --blue-neon: #0088ff;
            --purple-neon: #8a2be2;
            --text-light: #e0e0e0;
            --danger: #ff3333;
            --warning: #ffb400;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden; /* Evita barra de rolagem no projetor */
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 136, 255, 0.05) 0%, transparent 70%),
                linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8));
        }

        /* HEADER: Logo e Cronômetro */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            height: 15vh;
            border-bottom: 2px solid var(--blue-neon);
            box-shadow: 0 0 20px rgba(0, 136, 255, 0.2);
            background: rgba(3, 6, 19, 0.9);
        }

        .logo-container img {
            max-height: 100px;
            object-fit: contain;
        }

        .header-title {
            text-align: center;
        }

        .header-title h1 {
            margin: 0;
            font-size: 2.5em;
            background: linear-gradient(90deg, var(--green-neon), var(--blue-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        .header-title h2 {
            margin: 5px 0 0 0;
            font-size: 1.2em;
            color: var(--purple-neon);
            letter-spacing: 5px;
        }

        .timer-container {
            text-align: right;
            cursor: pointer; /* Indica que é clicável para iniciar */
        }

        .timer {
            font-size: 4em;
            font-weight: bold;
            color: var(--danger);
            text-shadow: 0 0 15px rgba(255, 51, 51, 0.8);
            margin: 0;
            line-height: 1;
            transition: color 0.3s;
        }

        .timer-label {
            font-size: 1em;
            color: var(--text-light);
            letter-spacing: 2px;
        }

        /* GRID PRINCIPAL 16:9 (2 linhas x 5 colunas para as 10 equipes) */
        main {
            flex-grow: 1;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 1.5vw;
            padding: 1.5vw 3vw;
            box-sizing: border-box;
        }

        /* CARDS DAS EQUIPES */
        .team-card {
            background-color: var(--bg-panel);
            border: 1px solid rgba(0, 136, 255, 0.3);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .team-card:hover {
            border-color: var(--green-neon);
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.2);
            transform: translateY(-2px);
        }

        .team-name {
            font-size: 1.2em;
            font-weight: bold;
            color: #fff;
            text-align: center;
            margin: 0 0 10px 0;
            text-transform: uppercase;
        }

        .status-text {
            font-size: 0.9em;
            text-align: center;
            color: rgba(255,255,255,0.5);
            margin-bottom: 10px;
            height: 1.2em;
        }

        /* BARRA DE PROGRESSO */
        .progress-container {
            display: flex;
            justify-content: space-between;
            gap: 5px;
            margin-bottom: 10px;
        }

        .progress-step {
            flex-grow: 1;
            height: 15px;
            background-color: rgba(255,255,255,0.1);
            border-radius: 3px;
            border: 1px solid rgba(0,0,0,0.5);
            transition: all 0.5s ease;
        }

        .step-label-container {
            display: flex;
            justify-content: space-between;
            font-size: 0.7em;
            color: rgba(255,255,255,0.4);
        }

        /* ESTADOS DOS CARDS (Classes dinâmicas controladas pelo JS) */
        
        /* Fase 1 */
        .team-card[data-fase="1"] .progress-step:nth-child(1) { background-color: var(--blue-neon); box-shadow: 0 0 8px var(--blue-neon); }
        .team-card[data-fase="1"] .status-text { color: var(--blue-neon); }

        /* Fase 2 */
        .team-card[data-fase="2"] .progress-step:nth-child(1),
        .team-card[data-fase="2"] .progress-step:nth-child(2) { background-color: var(--blue-neon); box-shadow: 0 0 8px var(--blue-neon); }
        .team-card[data-fase="2"] .status-text { color: var(--blue-neon); }

        /* Fase 3 */
        .team-card[data-fase="3"] .progress-step:nth-child(1),
        .team-card[data-fase="3"] .progress-step:nth-child(2),
        .team-card[data-fase="3"] .progress-step:nth-child(3) { background-color: var(--purple-neon); box-shadow: 0 0 8px var(--purple-neon); }
        .team-card[data-fase="3"] .status-text { color: var(--purple-neon); }

        /* Fase 4 */
        .team-card[data-fase="4"] .progress-step:nth-child(1),
        .team-card[data-fase="4"] .progress-step:nth-child(2),
        .team-card[data-fase="4"] .progress-step:nth-child(3),
        .team-card[data-fase="4"] .progress-step:nth-child(4) { background-color: var(--warning); box-shadow: 0 0 8px var(--warning); }
        .team-card[data-fase="4"] .status-text { color: var(--warning); }

        /* Concluído */
        .team-card[data-fase="5"] { 
            border-color: var(--green-neon); 
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.4); 
            background: rgba(57, 255, 20, 0.1);
        }
        .team-card[data-fase="5"] .progress-step { background-color: var(--green-neon); box-shadow: 0 0 10px var(--green-neon); }
        .team-card[data-fase="5"] .status-text { color: var(--green-neon); font-weight: bold; text-shadow: 0 0 5px var(--green-neon); }
        .team-card[data-fase="5"] .team-name { color: var(--green-neon); text-shadow: 0 0 5px var(--green-neon); }

        /* Instrução Oculta para o Admin */
        .admin-tip {
            position: absolute;
            bottom: 5px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 0.8em;
            color: rgba(255,255,255,0.3);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .team-card:hover .admin-tip { opacity: 1; }

    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="IMG-20261021-WA0004.jpg" alt="Logo Patent DNA">
        </div>
        <div class="header-title">
            <h1>MONITORAMENTO DE REDE</h1>
            <h2>DIVISÕES DE PESQUISA</h2>
        </div>
        <div class="timer-container" onclick="toggleTimer()" title="Clique para iniciar/pausar o relógio">
            <div class="timer" id="display-timer">60:00</div>
            <div class="timer-label">TEMPO RESTANTE</div>
        </div>
    </header>

    <main id="grid-equipes">
        <!-- Os cards serão gerados pelo JavaScript aqui -->
    </main>

    <script>
        // 1. DADOS DAS EQUIPES
        // Utilizando os mesmos nomes das equipes da oficina
        const equipes = [
            { id: 'biomaterials', nome: 'Team Biomaterials' },
            { id: 'diagnostics', nome: 'Team Diagnostics' },
            { id: 'bioai', nome: 'Team BioAI' },
            { id: 'regenerative', nome: 'Team Regenerative' },
            { id: 'nanobiotech', nome: 'Team Nanobiotech' },
            { id: 'biodevices', nome: 'Team BioDevices' },
            { id: 'synthetic', nome: 'Team Synthetic' },
            { id: 'precision', nome: 'Team Precision' },
            { id: 'genomics', nome: 'Team Genomics' },
            { id: 'biotherapeutics', nome: 'Team Biotherapeutics' }
        ];

        const textStatus = [
            "AGUARDANDO ACESSO...",     // 0
            "ANALISANDO ANTERIORIDADE", // 1
            "ESTRUTURANDO PATENTE",     // 2
            "VALIDANDO COFRE BIOLÓGICO",// 3
            "GERANDO DEPÓSITO INPI",    // 4
            "PATENTE DEPOSITADA!"       // 5
        ];

        // 2. GERAR CARDS NO HTML
        const grid = document.getElementById('grid-equipes');

        equipes.forEach(equipe => {
            const card = document.createElement('div');
            card.className = 'team-card';
            card.setAttribute('data-fase', '0');
            card.id = `card-${equipe.id}`;
            
            // Função de Clique: Botão Esquerdo avança, Shift+Botão Esquerdo retrocede (caso clique sem querer)
            card.onclick = (e) => atualizarFase(equipe.id, e.shiftKey ? -1 : 1);

            card.innerHTML = `
                <h3 class="team-name">${equipe.nome}</h3>
                <div class="status-text" id="status-${equipe.id}">${textStatus[0]}</div>
                
                <div class="progress-container">
                    <div class="progress-step"></div>
                    <div class="progress-step"></div>
                    <div class="progress-step"></div>
                    <div class="progress-step"></div>
                </div>
                
                <div class="step-label-container">
                    <span>F1</span>
                    <span>F2</span>
                    <span>F3</span>
                    <span>F4</span>
                </div>
                <div class="admin-tip">Click: Avançar | Shift+Click: Voltar</div>
            `;
            
            grid.appendChild(card);
        });

        // 3. FUNÇÃO DE CONTROLE DE FASES
        function atualizarFase(id, direcao) {
            const card = document.getElementById(`card-${id}`);
            const statusLabel = document.getElementById(`status-${id}`);
            let faseAtual = parseInt(card.getAttribute('data-fase'));
            
            // Calcula nova fase limitando entre 0 e 5
            let novaFase = faseAtual + direcao;
            if (novaFase < 0) novaFase = 0;
            if (novaFase > 5) novaFase = 5;

            card.setAttribute('data-fase', novaFase);
            statusLabel.innerText = textStatus[novaFase];
        }

        // 4. LÓGICA DO CRONÔMETRO
        let tempoRestante = 60 * 60; // 60 minutos em segundos
        let timerInterval = null;
        const displayTimer = document.getElementById('display-timer');

        function atualizarDisplay() {
            let minutos = Math.floor(tempoRestante / 60);
            let segundos = tempoRestante % 60;
            
            // Formata para 2 dígitos (ex: 09:05)
            minutos = minutos < 10 ? "0" + minutos : minutos;
            segundos = segundos < 10 ? "0" + segundos : segundos;
            
            displayTimer.innerText = `${minutos}:${segundos}`;

            // Muda de cor quando faltar menos de 10 minutos
            if(tempoRestante <= 600) {
                displayTimer.style.color = "var(--danger)"; // Vermelho piscante
                if(tempoRestante % 2 === 0) displayTimer.style.opacity = "0.5";
                else displayTimer.style.opacity = "1";
            } else {
                displayTimer.style.color = "var(--green-neon)"; // Verde normal
                displayTimer.style.opacity = "1";
            }
        }

        function toggleTimer() {
            if (timerInterval) {
                // Pausar
                clearInterval(timerInterval);
                timerInterval = null;
            } else {
                // Iniciar
                timerInterval = setInterval(() => {
                    if (tempoRestante > 0) {
                        tempoRestante--;
                        atualizarDisplay();
                    } else {
                        clearInterval(timerInterval);
                        displayTimer.innerText = "TEMPO ESGOTADO!";
                    }
                }, 1000);
            }
        }

        // Inicializa o cronômetro na tela (parado)
        atualizarDisplay();

    </script>
</body>
</html>
